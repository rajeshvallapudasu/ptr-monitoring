<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTR Monitoring System | TGTRANSCO</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0e1a;
            --secondary-dark: #151b2e;
            --accent-blue: #00d4ff;
            --accent-yellow: #ffd600;
            --accent-orange: #ff8c00;
            --accent-red: #ff3838;
            --accent-green: #00ff88;
            --text-primary: #e8edf4;
            --text-secondary: #8b9bb4;
            --border-color: #2a3548;
            --grid-color: rgba(0, 212, 255, 0.1);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, var(--grid-color) 0px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, var(--grid-color) 0px, transparent 1px, transparent 40px);
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 2rem;
        }

        .login-container {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(255, 214, 0, 0.05) 100%);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 1;
        }

        .login-logo {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
            50% { text-shadow: 0 0 40px rgba(0, 212, 255, 0.8); }
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(10, 14, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            background: rgba(10, 14, 26, 0.8);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--accent-blue);
            border: none;
            border-radius: 4px;
            color: var(--primary-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert-error {
            padding: 1rem;
            background: rgba(255, 56, 56, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 4px;
            color: var(--accent-red);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .alert-success {
            padding: 1rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-green);
            border-radius: 4px;
            color: var(--accent-green);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(255, 214, 0, 0.05) 100%);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            animation: scanline 3s linear infinite;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }

        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(21, 27, 46, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            border: 2px solid var(--accent-blue);
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .btn-logout {
            padding: 0.5rem 1.5rem;
            background: transparent;
            border: 1px solid var(--accent-red);
            border-radius: 4px;
            color: var(--accent-red);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: var(--accent-red);
            color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 56, 56, 0.3);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(21, 27, 46, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .select-input {
            padding: 0.625rem 1rem;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .select-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .date-input {
            padding: 0.625rem 1rem;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            transition: all 0.3s;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .btn-refresh {
            padding: 0.625rem 1.5rem;
            background: var(--accent-blue);
            border: none;
            border-radius: 4px;
            color: var(--primary-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: 0.4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-green);
            border-radius: 4px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-green); }
            50% { opacity: 0.6; box-shadow: 0 0 20px var(--accent-green); }
        }

        .breadcrumb {
            padding: 1rem 2rem;
            background: rgba(21, 27, 46, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .breadcrumb span {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .ptr-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .ptr-card {
            background: linear-gradient(135deg, rgba(21, 27, 46, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 2rem;
            position: relative;
            transition: all 0.3s;
        }

        .ptr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-blue);
            transition: all 0.3s;
        }

        .ptr-card.warning::before { background: var(--accent-yellow); }
        .ptr-card.critical::before { background: var(--accent-red); }

        .ptr-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
        }

        .ptr-header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .ptr-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .ptr-specs {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .ptr-status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ptr-status-badge.normal {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .ptr-status-badge.warning {
            background: rgba(255, 214, 0, 0.2);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
        }

        .ptr-status-badge.critical {
            background: rgba(255, 56, 56, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .ptr-peak-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .peak-value {
            display: flex;
            flex-direction: column;
        }

        .peak-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-blue);
            font-variant-numeric: tabular-nums;
        }

        .peak-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .loading-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .loading-fill {
            height: 100%;
            transition: width 0.5s ease, background 0.3s;
            border-radius: 4px;
        }

        .loading-fill.normal { background: linear-gradient(90deg, var(--accent-green), var(--accent-blue)); }
        .loading-fill.warning { background: linear-gradient(90deg, var(--accent-yellow), var(--accent-orange)); }
        .loading-fill.critical { background: linear-gradient(90deg, var(--accent-red), var(--accent-orange)); }

        .loading-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .time-slot {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1rem;
            transition: all 0.3s;
        }

        .time-slot:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 212, 255, 0.05);
        }

        .time-slot-header {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .time-slot-values {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .slot-value {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .value-number {
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .value-number.active { color: var(--accent-green); }
        .value-number.inactive { color: var(--text-secondary); }

        .value-unit {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .no-data-message {
            text-align: center;
            padding: 3rem;
            background: rgba(21, 27, 46, 0.6);
            border: 2px dashed var(--border-color);
            border-radius: 4px;
            margin: 2rem 0;
        }

        .no-data-message h3 {
            color: var(--accent-blue);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .no-data-message p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Data Entry Styles */
        .entry-container {
            background: rgba(21, 27, 46, 0.6);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .entry-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .ptr-entry-grid {
            display: grid;
            gap: 2rem;
        }

        .ptr-entry-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(10, 14, 26, 0.8) 100%);
            border: 2px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            border-radius: 4px;
            padding: 2rem;
        }

        .ptr-entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .ptr-entry-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .ptr-entry-specs {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .slot-entry {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1rem;
            min-width: 0; /* Prevent overflow */
        }

        .slot-time {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slot-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            width: 100%; /* Ensure full width */
        }

        .slot-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 0; /* Prevent overflow */
        }

        .slot-input-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            white-space: nowrap; /* Prevent label wrapping */
        }

        .slot-input {
            width: 100%; /* Full width of container */
            padding: 0.625rem 0.5rem;
            background: rgba(10, 14, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            text-align: center;
            transition: all 0.3s;
            box-sizing: border-box; /* Include padding in width */
            min-width: 0; /* Prevent overflow */
        }

        .slot-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
            background: rgba(10, 14, 26, 0.9);
        }

        .slot-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* Prevent input zoom on mobile */
        @media screen and (max-width: 768px) {
            .slot-input {
                font-size: 16px; /* Prevents zoom on iOS */
            }
        }

        .btn-submit {
            width: 100%;
            padding: 1rem 2rem;
            background: var(--accent-green);
            border: none;
            border-radius: 4px;
            color: var(--primary-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            margin-top: 2rem;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;

        // MAIN APP
        // ========================================

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            useEffect(() => {
                const session = sessionStorage.getItem('ptr_session');
                if (session) {
                    try {
                        const user = JSON.parse(session);
                        setCurrentUser(user);
                        setIsAuthenticated(true);
                    } catch (error) {
                        sessionStorage.removeItem('ptr_session');
                    }
                }
            }, []);

            const handleLogin = (user) => {
                setCurrentUser(user);
                setIsAuthenticated(true);
                sessionStorage.setItem('ptr_session', JSON.stringify(user));
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setIsAuthenticated(false);
                sessionStorage.removeItem('ptr_session');
            };

            if (!isAuthenticated) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            // Route based on role
            if (currentUser.role === 'Admin') {
                return <MonitoringDashboard user={currentUser} onLogout={handleLogout} />;
            } else {
                return <DataEntryDashboard user={currentUser} onLogout={handleLogout} />;
            }
        }

        // ========================================
        // LOGIN SCREEN
        // ========================================

        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                setTimeout(() => {
                    const user = USERS.find(u => u.username === username && u.password === password);
                    
                    if (user) {
                        onLogin(user);
                    } else {
                        setError('Invalid username or password');
                        setLoading(false);
                    }
                }, 600);
            };

            return (
                <div className="login-wrapper">
                    <div className="login-container">
                        <div className="login-header">
                            <div className="login-logo">⚡</div>
                            <h1 className="login-title">PTR Monitoring</h1>
                            <p className="login-subtitle">{CIRCLE_CONFIG.name} | TGTRANSCO</p>
                        </div>

                        {error && (
                            <div className="alert-error">
                                <strong>⚠️ Authentication Failed</strong><br/>{error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">Username</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    placeholder="Enter username"
                                    required
                                    autoFocus
                                />
                            </div>

                            <div className="form-group">
                                <label className="form-label">Password</label>
                                <input
                                    type="password"
                                    className="form-input"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="Enter password"
                                    required
                                />
                            </div>

                            <button type="submit" className="btn-login" disabled={loading}>
                                {loading ? 'Authenticating...' : 'Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ========================================
        // MONITORING DASHBOARD (Admin Only)
        // ========================================

        function MonitoringDashboard({ user, onLogout }) {
            const [selectedSubstation, setSelectedSubstation] = useState(SUBSTATIONS[0].id);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [readings, setReadings] = useState(null);
            const [loading, setLoading] = useState(false);
            const [lastUpdate, setLastUpdate] = useState(null);
            const [autoRefresh, setAutoRefresh] = useState(true);

            const currentSubstation = SUBSTATIONS.find(s => s.id === selectedSubstation);
            const currentPTRs = PTR_CONFIG[selectedSubstation] || [];

            useEffect(() => {
                loadData();
            }, [selectedSubstation, selectedDate]);

            useEffect(() => {
                if (!autoRefresh) return;
                const interval = setInterval(() => loadData(), 30000);
                return () => clearInterval(interval);
            }, [autoRefresh, selectedSubstation, selectedDate]);

            const loadData = async () => {
                const apiUrl = CIRCLE_CONFIG.apiUrl;
                
                if (!apiUrl || apiUrl.includes('YOUR_')) {
                    setReadings(generateMockData());
                    setLastUpdate(new Date());
                    return;
                }

                setLoading(true);
                try {
                    const url = `${apiUrl}?action=getReadings&date=${selectedDate}&substationId=${selectedSubstation}`;
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.status === 'success') {
                        setReadings(data.data);
                        setLastUpdate(new Date());
                    } else {
                        setReadings(generateMockData());
                    }
                } catch (error) {
                    setReadings(generateMockData());
                } finally {
                    setLoading(false);
                }
            };

            const generateMockData = () => {
                const mockData = {};
                currentPTRs.forEach(ptr => {
                    mockData[ptr.id] = {};
                    timeSlots.forEach(time => {
                        const randomMW = (Math.random() * ptr.capacity * 0.7).toFixed(1);
                        const randomAmps = (Math.random() * ptr.rated * 0.7).toFixed(1);
                        mockData[ptr.id][time] = {
                            mw: parseFloat(randomMW),
                            amps: parseFloat(randomAmps)
                        };
                    });
                });
                return mockData;
            };

            const getPeakAmps = (ptrId) => {
                if (!readings || !readings[ptrId]) return 0;
                return Math.max(...Object.values(readings[ptrId]).map(r => r.amps || 0));
            };

            const getPeakMW = (ptrId) => {
                if (!readings || !readings[ptrId]) return 0;
                return Math.max(...Object.values(readings[ptrId]).map(r => r.mw || 0));
            };

            const getStatus = (amps, rated) => {
                const pct = (amps / rated) * 100;
                if (pct >= 90) return 'critical';
                if (pct >= 75) return 'warning';
                return 'normal';
            };

            const getLoadingPercent = (amps, rated) => {
                return Math.min(((amps / rated) * 100), 100);
            };

            const getUserInitials = (name) => {
                return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>PTR LOAD MONITORING</h1>
                        <p>{CIRCLE_CONFIG.name} | TGTRANSCO</p>
                    </div>

                    <div className="user-info-bar">
                        <div className="user-badge">
                            <div className="user-avatar">{getUserInitials(user.name)}</div>
                            <div className="user-details">
                                <div className="user-name">{user.name}</div>
                                <div className="user-role">{user.role}</div>
                            </div>
                        </div>
                        <div style={{display: 'flex', alignItems: 'center', gap: '1rem', flexWrap: 'wrap'}}>
                            <div className="status-badge">
                                <div className="status-dot"></div>
                                <span style={{fontSize: '0.75rem', fontWeight: '600', textTransform: 'uppercase'}}>
                                    Live Monitoring
                                </span>
                            </div>
                            {lastUpdate && (
                                <div style={{fontSize: '0.75rem', color: 'var(--text-secondary)'}}>
                                    Updated: {lastUpdate.toLocaleTimeString('en-IN')}
                                </div>
                            )}
                            <button className="btn-logout" onClick={onLogout}>
                                Logout
                            </button>
                        </div>
                    </div>

                    <div className="breadcrumb">
                        <span>{CIRCLE_CONFIG.name}</span> → <span>{currentSubstation?.name}</span> → <span>{currentSubstation?.division}</span>
                    </div>

                    <div className="controls">
                        <div className="control-group">
                            <label className="control-label">Substation</label>
                            <select 
                                className="select-input"
                                value={selectedSubstation}
                                onChange={(e) => setSelectedSubstation(e.target.value)}
                            >
                                {SUBSTATIONS.map(sub => (
                                    <option key={sub.id} value={sub.id}>
                                        {sub.name} ({sub.division})
                                    </option>
                                ))}
                            </select>
                        </div>

                        <div className="control-group">
                            <label className="control-label">Date</label>
                            <input 
                                type="date"
                                className="date-input"
                                value={selectedDate}
                                onChange={(e) => setSelectedDate(e.target.value)}
                            />
                        </div>

                        <div className="control-group">
                            <label className="control-label">Actions</label>
                            <button className="btn-refresh" onClick={loadData} disabled={loading}>
                                {loading ? '⟳ Loading...' : '🔄 Refresh'}
                            </button>
                        </div>

                        <div className="control-group">
                            <label className="control-label">Auto-Refresh</label>
                            <div className="auto-refresh">
                                <label className="switch">
                                    <input 
                                        type="checkbox"
                                        checked={autoRefresh}
                                        onChange={(e) => setAutoRefresh(e.target.checked)}
                                    />
                                    <span className="slider"></span>
                                </label>
                                <span style={{fontSize: '0.75rem', color: 'var(--text-secondary)'}}>
                                    {autoRefresh ? 'ON (30s)' : 'OFF'}
                                </span>
                            </div>
                        </div>
                    </div>

                    {currentPTRs.length === 0 ? (
                        <div className="no-data-message">
                            <h3>⚠️ No PTR Configuration</h3>
                            <p>PTR configuration not available for {currentSubstation?.name}.</p>
                        </div>
                    ) : readings ? (
                        <div className="ptr-grid">
                            {currentPTRs.map(ptr => {
                                const peakAmps = getPeakAmps(ptr.id);
                                const peakMW = getPeakMW(ptr.id);
                                const status = getStatus(peakAmps, ptr.rated);
                                const loadingPct = getLoadingPercent(peakAmps, ptr.rated);

                                return (
                                    <div key={ptr.id} className={`ptr-card ${status}`}>
                                        <div className="ptr-header-section">
                                            <div>
                                                <div className="ptr-title">{ptr.name}</div>
                                                <div className="ptr-specs">{ptr.voltage} | {ptr.capacity} MVA | Rated: {ptr.rated}A</div>
                                            </div>
                                            <div className={`ptr-status-badge ${status}`}>
                                                {status === 'normal' ? '● Normal' : status === 'warning' ? '▲ Warning' : '✖ Critical'}
                                            </div>
                                        </div>

                                        <div className="ptr-peak-display">
                                            <div className="peak-value">
                                                <div className="peak-number">{peakAmps.toFixed(1)}</div>
                                                <div className="peak-label">Peak Amps</div>
                                            </div>
                                            <div className="peak-value">
                                                <div className="peak-number">{peakMW.toFixed(1)}</div>
                                                <div className="peak-label">Peak MW</div>
                                            </div>
                                        </div>

                                        <div className="loading-bar">
                                            <div className={`loading-fill ${status}`} style={{width: `${loadingPct}%`}}></div>
                                        </div>
                                        <div className="loading-text">{loadingPct.toFixed(1)}% Loading ({peakAmps.toFixed(1)}A / {ptr.rated}A)</div>

                                        <div style={{height: '1.5rem'}}></div>

                                        <div className="time-slots">
                                            {timeSlots.map(time => {
                                                const reading = readings[ptr.id]?.[time] || { mw: 0, amps: 0 };
                                                const hasData = reading.mw > 0 || reading.amps > 0;

                                                return (
                                                    <div key={time} className="time-slot">
                                                        <div className="time-slot-header">{time} HRS</div>
                                                        <div className="time-slot-values">
                                                            <div className="slot-value">
                                                                <div className={`value-number ${hasData ? 'active' : 'inactive'}`}>
                                                                    {reading.mw.toFixed(1)}
                                                                </div>
                                                                <div className="value-unit">MW</div>
                                                            </div>
                                                            <div className="slot-value">
                                                                <div className={`value-number ${hasData ? 'active' : 'inactive'}`}>
                                                                    {reading.amps.toFixed(1)}
                                                                </div>
                                                                <div className="value-unit">Amps</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="no-data-message">
                            <h3>Loading...</h3>
                            <p>Fetching data for {currentSubstation?.name}...</p>
                        </div>
                    )}
                </div>
            );
        }

        // ========================================
        // DATA ENTRY DASHBOARD (Operator Only)
        // ========================================

        function DataEntryDashboard({ user, onLogout }) {
            const [entryDate, setEntryDate] = useState(new Date().toISOString().split('T')[0]);
            const [formData, setFormData] = useState({});
            const [submitting, setSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null);

            const substationId = user.substationId;
            const ptrs = PTR_CONFIG[substationId] || [];

            useEffect(() => {
                const initialData = {};
                ptrs.forEach(ptr => {
                    initialData[ptr.id] = {};
                    timeSlots.forEach(time => {
                        initialData[ptr.id][time] = { mw: '', amps: '' };
                    });
                });
                setFormData(initialData);
            }, [substationId]);

            const handleInputChange = (ptrId, time, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    [ptrId]: {
                        ...prev[ptrId],
                        [time]: {
                            ...prev[ptrId][time],
                            [field]: value
                        }
                    }
                }));
            };

            const handleSubmit = async () => {
                setSubmitting(true);
                setSubmitStatus({ type: 'submitting', message: 'Submitting data...' });

                const apiUrl = CIRCLE_CONFIG.apiUrl;

                // Collect all readings
                const readings = [];
                ptrs.forEach(ptr => {
                    timeSlots.forEach(time => {
                        const data = formData[ptr.id]?.[time];
                        if (data && (data.mw || data.amps)) {
                            readings.push({
                                substationId: substationId,
                                date: entryDate,
                                time: time,
                                ptrId: ptr.id,
                                ptrName: `${ptr.name} (${ptr.voltage})`,
                                mw: parseFloat(data.mw) || 0,
                                amps: parseFloat(data.amps) || 0,
                                user: user.name,
                                source: 'Data Entry Form'
                            });
                        }
                    });
                });

                if (readings.length === 0) {
                    setSubmitStatus({ type: 'error', message: 'No data to submit. Please enter at least one reading.' });
                    setSubmitting(false);
                    return;
                }

                console.log(`Submitting ${readings.length} readings...`);

                let successCount = 0;
                let errorCount = 0;
                const errors = [];

                // Submit each reading one by one
                for (const reading of readings) {
                    try {
                        // Create form data for Google Apps Script
                        const formData = new FormData();
                        formData.append('action', 'saveReading');
                        formData.append('substationId', reading.substationId);
                        formData.append('date', reading.date);
                        formData.append('time', reading.time);
                        formData.append('ptrId', reading.ptrId);
                        formData.append('ptrName', reading.ptrName);
                        formData.append('mw', reading.mw);
                        formData.append('amps', reading.amps);
                        formData.append('user', reading.user);
                        formData.append('source', reading.source);

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            body: formData,
                            redirect: 'follow'
                        });

                        const text = await response.text();
                        console.log('Response:', text);

                        try {
                            const result = JSON.parse(text);
                            if (result.status === 'success') {
                                successCount++;
                                console.log(`✓ Saved: ${reading.ptrId} @ ${reading.time}`);
                            } else {
                                errorCount++;
                                errors.push(`${reading.ptrId} @ ${reading.time}: ${result.message}`);
                                console.error(`✗ Failed: ${reading.ptrId} @ ${reading.time}`, result.message);
                            }
                        } catch (parseError) {
                            // Response might be HTML redirect
                            if (text.includes('success') || text.includes('Successfully')) {
                                successCount++;
                                console.log(`✓ Saved: ${reading.ptrId} @ ${reading.time}`);
                            } else {
                                errorCount++;
                                errors.push(`${reading.ptrId} @ ${reading.time}: Parse error`);
                                console.error(`✗ Parse error for: ${reading.ptrId} @ ${reading.time}`);
                            }
                        }
                    } catch (error) {
                        errorCount++;
                        errors.push(`${reading.ptrId} @ ${reading.time}: ${error.message}`);
                        console.error(`✗ Network error for: ${reading.ptrId} @ ${reading.time}`, error);
                    }
                }

                // Show results
                console.log(`Submission complete: ${successCount} success, ${errorCount} errors`);

                if (errorCount === 0) {
                    setSubmitStatus({
                        type: 'success',
                        message: `✅ Successfully submitted ${successCount} readings for ${entryDate}!`
                    });
                    
                    // Clear form on success
                    const clearedData = {};
                    ptrs.forEach(ptr => {
                        clearedData[ptr.id] = {};
                        timeSlots.forEach(time => {
                            clearedData[ptr.id][time] = { mw: '', amps: '' };
                        });
                    });
                    setFormData(clearedData);
                } else if (successCount > 0) {
                    setSubmitStatus({
                        type: 'error',
                        message: `⚠️ Submitted ${successCount} readings successfully, but ${errorCount} failed. Check console for details.`
                    });
                    console.error('Errors:', errors);
                } else {
                    setSubmitStatus({
                        type: 'error',
                        message: `❌ All submissions failed. Please check your API configuration and try again.`
                    });
                    console.error('Errors:', errors);
                }

                setSubmitting(false);
                setTimeout(() => setSubmitStatus(null), 8000);
            };

            const getUserInitials = (name) => {
                return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>PTR DATA ENTRY</h1>
                        <p>{CIRCLE_CONFIG.name} | TGTRANSCO</p>
                    </div>

                    <div className="user-info-bar">
                        <div className="user-badge">
                            <div className="user-avatar">{getUserInitials(user.name)}</div>
                            <div className="user-details">
                                <div className="user-name">{user.name}</div>
                                <div className="user-role">{user.role} - {user.substationName}</div>
                            </div>
                        </div>
                        <button className="btn-logout" onClick={onLogout}>
                            Logout
                        </button>
                    </div>

                    <div className="entry-container">
                        <div className="entry-header">
                            <div className="entry-title">📝 {SUBSTATIONS.find(s => s.id === substationId)?.name}</div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '1rem'}}>
                                <label style={{fontSize: '0.75rem', color: 'var(--text-secondary)', textTransform: 'uppercase'}}>
                                    Entry Date:
                                </label>
                                <input
                                    type="date"
                                    className="date-input"
                                    value={entryDate}
                                    onChange={(e) => setEntryDate(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="ptr-entry-grid">
                            {ptrs.map(ptr => (
                                <div key={ptr.id} className="ptr-entry-card">
                                    <div className="ptr-entry-header">
                                        <div>
                                            <div className="ptr-entry-title">{ptr.name}</div>
                                            <div className="ptr-entry-specs">{ptr.voltage} | {ptr.capacity} MVA | Rated: {ptr.rated}A</div>
                                        </div>
                                    </div>

                                    <div className="slots-grid">
                                        {timeSlots.map(time => (
                                            <div key={time} className="slot-entry">
                                                <div className="slot-time">⏰ {time} HRS</div>
                                                <div className="slot-inputs">
                                                    <div className="slot-input-group">
                                                        <label className="slot-input-label">Load (MW)</label>
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            className="slot-input"
                                                            placeholder="0.0"
                                                            value={formData[ptr.id]?.[time]?.mw || ''}
                                                            onChange={(e) => handleInputChange(ptr.id, time, 'mw', e.target.value)}
                                                        />
                                                    </div>
                                                    <div className="slot-input-group">
                                                        <label className="slot-input-label">HV Amps</label>
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            className="slot-input"
                                                            placeholder="0.0"
                                                            value={formData[ptr.id]?.[time]?.amps || ''}
                                                            onChange={(e) => handleInputChange(ptr.id, time, 'amps', e.target.value)}
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button 
                            className="btn-submit" 
                            onClick={handleSubmit}
                            disabled={submitting}
                        >
                            {submitting ? '⏳ Submitting...' : '✅ Submit All Data'}
                        </button>

                        {submitStatus && (
                            <div className={`submit-status ${submitStatus.type}`}>
                                {submitStatus.message}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
